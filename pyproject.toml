[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reglens"
version = "0.1.0"
description = "Cited, temporally-aware RAG over Indian banking regulation (RBI/SEBI) and bank filings."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
# Policy: a dependency is added in the phase that first uses it, so the lock file
# never advertises capability the code does not have yet. See docs/architecture.md.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    "asyncpg>=0.30",
]

[project.scripts]
reglens = "reglens.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reglens"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: needs a live Postgres (docker compose up -d postgres)",
    "eval: exercises a real model provider; requires API keys",
]
filterwarnings = ["error::DeprecationWarning:reglens.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts", "eval"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PTH", "T20", "ARG", "RET"]
ignore = [
    "E501",   # line length is handled by the formatter
    "RUF001", # allow en/em dashes in docstrings about Indian regulation text
    "ARG001", # unused function args are common in Protocol implementations
    "SIM105", # explicit try/except reads better than contextlib.suppress here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20", "ARG"]
"scripts/*" = ["T20"]
"eval/*" = ["T20"]   # eval runners print result tables on purpose
"src/reglens/cli.py" = ["T20"]  # the CLI's job is to print

[tool.ruff.format]
quote-style = "double"
