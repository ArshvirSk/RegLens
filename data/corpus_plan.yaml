  # ------------------------------------------------------------------ Bank and NBFC filings
  # Every filing row points at the issuer's investor-relations page (discovery: listing),
  # because annual-report and transcript URLs carry a fiscal year and break every year.
  # `notes` names the target document; the fetcher resolves candidates from the page and a
  # human confirms the exact file before it is ingested. Fiscal years are Indian FYs
  # (FY2025 = year ended 31 March 2025).
  #
  # --- State Bank of India (PSU bank; largest by assets, most RBI-facing) ---
  - {doc_id: sbi_ar_fy2025, source: bank_ir, issuer: SBI, doc_type: annual_report, fiscal_period: FY2025, discovery: listing, title: "State Bank of India Annual Report FY2024-25", url: "https://sbi.co.in/web/investor-relations", notes: "target: FY2024-25 annual report PDF on the IR page"}
  - {doc_id: sbi_ar_fy2024, source: bank_ir, issuer: SBI, doc_type: annual_report, fiscal_period: FY2024, discovery: listing, title: "State Bank of India Annual Report FY2023-24", url: "https://sbi.co.in/web/investor-relations", notes: "target: FY2023-24 annual report PDF"}
  - {doc_id: sbi_transcript_fy2025_q4, source: bank_ir, issuer: SBI, doc_type: transcript, fiscal_period: FY2025-Q4, discovery: listing, title: "State Bank of India Q4 FY2025 earnings call transcript", url: "https://sbi.co.in/web/investor-relations", notes: "target: Q4 FY2024-25 transcript; if SBI publishes only an analyst-meet presentation, record that instead"}
  - {doc_id: sbi_transcript_fy2025_q3, source: bank_ir, issuer: SBI, doc_type: transcript, fiscal_period: FY2025-Q3, discovery: listing, title: "State Bank of India Q3 FY2025 earnings call transcript", url: "https://sbi.co.in/web/investor-relations", notes: "target: Q3 FY2024-25 transcript"}
  - {doc_id: sbi_transcript_fy2025_q2, source: bank_ir, issuer: SBI, doc_type: transcript, fiscal_period: FY2025-Q2, discovery: listing, title: "State Bank of India Q2 FY2025 earnings call transcript", url: "https://sbi.co.in/web/investor-relations", notes: "target: Q2 FY2024-25 transcript"}
  - {doc_id: sbi_transcript_fy2025_q1, source: bank_ir, issuer: SBI, doc_type: transcript, fiscal_period: FY2025-Q1, discovery: listing, title: "State Bank of India Q1 FY2025 earnings call transcript", url: "https://sbi.co.in/web/investor-relations", notes: "target: Q1 FY2024-25 transcript"}
