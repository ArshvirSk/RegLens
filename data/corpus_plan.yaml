# RegLens corpus plan — the reviewed source of data/manifest.csv.
#
# Regenerate the manifest from this file with:   make corpus-plan
# This file is human-editable on purpose: adding a document is a reviewed decision, not
# whatever a crawler happened to reach.
#
# Field notes
#   doc_id       stable id, lowercase; it is the citation key, so never renumber it
#   source       rbi | sebi | bank_ir | exchange | other
#   doc_type     master_direction | master_circular | circular | notification | regulation
#                | annual_report | transcript | quarterly_results | press_release | other
#   discovery    direct  = url is the document itself
#                listing = url is a landing/listing page; the exact PDF is resolved and
#                          named in `notes`, then confirmed by a human before ingest
#   status       planned | fetched | parsed | failed | excluded  (fetch state is preserved
#                across regenerations, so re-running never loses a hash)
#   issue_date   left empty where it has not been read from the document yet. Fabricating
#                dates would corrupt the Phase 3 temporal filter; Phase 1 extracts them
#                from the PDF cover page and fills them in.
#
# Verification provenance (2026-10-02, see docs/corpus-plan.md for the full report)
#   * Every URL below returned HTTP 200 on 2026-10-02 unless its note says otherwise.
#   * rbidocs.rbi.org.in serves PDFs only when a Referer header is sent; the bundled
#     fetcher sends the landing-page referer for that host.
#   * www.rbi.org.in/robots.txt answers 418 (WAF) and its document pages render from
#     ASP.NET viewstate, so RBI *listing* pages are recorded for manual browsing while
#     individual RBI documents are recorded as direct PDF links.
#   * www.sebi.gov.in/robots.txt allows crawling except /js and /css; its legal listings
#     are server-rendered and were parsed to produce the deep links below.
